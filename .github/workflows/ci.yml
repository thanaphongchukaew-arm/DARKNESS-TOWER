name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # unit + battle fuzz + shop economy + save compat + balance snapshot + dist/sw/asset guards
      - run: npm test
        env:
          FUZZ_SEEDS: 20
      - run: npm run build
      - run: git diff --exit-code dist/game.min.js

  # The real UI under a virtual display: smoke, shop/battle/events/minigames, layout audits.
  ui:
    runs-on: ubuntu-latest
    needs: build-test-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1
      - run: xvfb-run -a npm run smoke
      - run: xvfb-run -a npm run test:functional
      - run: xvfb-run -a npm run test:layout
      - run: xvfb-run -a npm run test:screens
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: layout-failures
          path: previews/*-layout/
          if-no-files-found: ignore
